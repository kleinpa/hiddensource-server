// Global Settings
sv_region 0
sv_lan 0

// Map Download
sv_allowdownload 1
sv_allowupload 1

// Communication
sv_voiceenable 0
decalfrequency 0

// Game Settings
mp_friendlyfire 1
mp_roundtime 300
mp_timelimit 20
hdn_hiddenrounds 3
hdn_jointime 20
hdn_selectmethod 2

// Unload all SourceMod plugins
sm plugins unload_all

// Load desired base SourceMod plugins
//
// No "disabled/" prefix on mapchooser/nominations/rockthevote: unlike an
// official SourceMod release (where those three genuinely ship in
// plugins/disabled/ and this is how a server opts into them), //:image
// builds SourceMod from source via rules_sourcemod, which installs these
// three to plain plugins/ instead -- SourceMod resolves a plugin's declared
// #include dependencies by file name, and mapchooser/nominations/
// rockthevote depend on each other, so loading any of them from disabled/
// makes every dependent fail with "Could not find required plugin". See
// //sourcemod:plugins.bzl's PROMOTED_PLUGINS in rules_sourcemod.
sm plugins load nextmap
sm plugins load mapchooser
sm plugins load nominations
sm plugins load rockthevote

// Load LAN of DOOM SourceMod plugins
sm plugins load auth_by_steam_group

// Configure SourceMod Plugins
sm_nominate_excludecurrent 0
sm_nominate_excludeold 0
sm_mapvote_exclude 0
sm_mapvote_extend 0
sm_mapvote_runoff 1
sm_rtv_initialdelay 0.0
sm_rtv_interval 0.0
sm_rtv_needed 0.50
