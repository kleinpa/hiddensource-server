name: publish
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-build
          repository-cache: true

      - name: Log into registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image that gets pushed is the -c opt one, which compiles
      # differently from a default (fastbuild) local test run -- test the exact
      # configuration being published. SRCDS_DOCKER_RUN_ARGS works around the
      # runner's default seccomp profile blocking 32-bit socket().
      - name: Test image
        run: >-
          bazel test -c opt
          --test_env=SRCDS_DOCKER_RUN_ARGS=--security-opt=seccomp=unconfined
          //...

      # The failure detail (which case, and the srcds console log the harness
      # attaches) lives only in the runner's test.log; keep it.
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-log
          path: bazel-testlogs/tests/server_test/test.log

      - name: Build and push image
        run: bazel run -c opt //:image_push
